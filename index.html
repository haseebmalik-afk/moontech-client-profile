<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moontech · Unit Economics 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* base — warm neutral, clean & bright */
  --bg:#F7F7F6; --bg-2:#F0F0EE; --card:#FFFFFF;
  --border:#E7E6E3; --border-soft:#EFEEEC; --hairline:#EFEEEC;
  --ink:#12131A; --text:#26272E; --text-2:#5E5F68; --text-3:#8E8F98; --text-4:#B0B1B8;
  /* signature — refined indigo */
  --accent:#4F46E5; --accent-600:#4338CA; --accent-700:#3730A3;
  --accent-soft:#EAE9FC; --accent-tint:#C2BEF3; --accent-wash:#F5F4FF;
  /* semantic — sign only */
  --good:#0E9F6E; --good-deep:#057A55; --good-bg:#E5F5EE;
  --bad:#DC2F44; --bad-deep:#B4223A; --bad-bg:#FBE9EC;
  --warn:#C77A0F; --warn-bg:#FCF1DE;
  --neutral-chip:#F0F0EE;
  /* sidebar — flat, warm-dark */
  --side-1:#17161C; --side-2:#111015; --side-text:#8A8B95; --side-dim:#5D5E67;
  --grid:#F0F0EE; --radius:12px; --radius-sm:9px;
  /* flat depth — hairline borders carry the cards */
  --shadow-sm:0 1px 2px rgba(18,19,26,.04);
  --shadow-md:0 1px 3px rgba(18,19,26,.06);
  --shadow-lg:0 4px 16px -4px rgba(18,19,26,.10);
  /* back-compat aliases */
  --indigo:#4F46E5; --indigo-600:#4338CA; --indigo-700:#3730A3;
  --indigo-soft:#EAE9FC; --indigo-tint:#C2BEF3; --indigo-wash:#F5F4FF;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
.num,td.num,.kpi-value,.lever input,table,.stat{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv01" 1}
.layout{display:flex; min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:198px; min-width:198px; background:var(--side-1);
  color:var(--side-text); position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  padding:22px 0 16px; box-shadow:inset -1px 0 0 rgba(255,255,255,.04), 6px 0 24px -14px rgba(20,24,33,.5); z-index:5}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:2px 20px 18px; margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.brand-logo{height:30px; width:auto; display:block}
.brand .mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(140deg,#6D63FF,#4F46E5);
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px -2px rgba(79,70,229,.5), inset 0 1px 0 rgba(255,255,255,.25); flex-shrink:0}
.brand .mark svg{width:19px; height:19px; display:block}
.brand .word{font-weight:700; letter-spacing:.02em; color:#fff; font-size:15px; line-height:1.1}
.brand .sub{font-size:11px; color:var(--side-text); margin-top:2px; letter-spacing:.01em}
.nav{flex:1; overflow-y:auto; padding-top:4px}
.nav a{display:flex; align-items:center; gap:10px; padding:9px 20px; color:var(--side-text); text-decoration:none;
  font-size:13.5px; font-weight:500; border-left:2.5px solid transparent; cursor:pointer; transition:color .15s, background .15s}
.nav a:hover{color:#D9DEE7; background:rgba(255,255,255,.03)}
.nav a.active{color:#fff; border-left-color:var(--indigo); background:linear-gradient(90deg,rgba(79,70,229,.20),rgba(79,70,229,.02)); font-weight:600}
.nav .group{padding:18px 20px 7px; font-size:10.5px; letter-spacing:.14em; color:#586173; text-transform:uppercase; font-weight:600}
.side-foot{padding:14px 20px 0; font-size:11px; color:#5B6474; border-top:1px solid rgba(255,255,255,.07); line-height:1.6}
.side-foot b{color:#B9C0CC; font-weight:600}

/* ---------- content: readable-fluid ---------- */
.content{flex:1; padding:30px clamp(24px,3.2vw,56px) 72px; width:100%; max-width:1720px; margin:0 auto}
.page{display:none}
.page.active{display:block; animation:fade .32s ease}
@keyframes fade{from{opacity:0} to{opacity:1}}
h1{font-size:23px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
.page-sub{color:var(--text-2); font-size:13.5px; margin-top:6px; max-width:74ch; line-height:1.6}
.page-head{margin-bottom:22px}
h2{font-size:15.5px; font-weight:650; letter-spacing:-.01em; margin-bottom:2px; color:var(--ink)}
.card-sub{color:var(--text-3); font-size:12px; margin-bottom:14px; line-height:1.55; max-width:80ch}

/* fluid grid — columns grow, not stretch to infinity */
.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:none}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}
.span-4{grid-column:span 4}.span-3{grid-column:span 3}
@media(max-width:1180px){.span-8{grid-column:span 12}.span-4{grid-column:span 6}.span-3{grid-column:span 6}}
@media(max-width:820px){.span-6,.span-4,.span-3{grid-column:span 12}}

/* KPI tiles — hairline accent + display number */
.kpi{position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--indigo),var(--indigo-tint)); opacity:.9}
.kpi.kpi-plain::before{background:linear-gradient(90deg,var(--text-3),var(--border))}
.kpi-label{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3);
  display:flex; align-items:center; gap:7px}
.kpi-value{font-family:inherit; font-size:29px; font-weight:800; margin-top:7px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--ink); line-height:1.05}
.kpi-note{font-size:11.5px; color:var(--text-2); margin-top:5px}
.kpi-spark{height:36px; margin-top:10px; margin-left:-2px; margin-right:-2px}
.delta-good{color:var(--good-deep)} .delta-bad{color:var(--bad-deep)}

.tag{display:inline-block; font-size:10px; font-weight:600; color:var(--text-3); background:var(--neutral-chip);
  border-radius:5px; padding:2px 6px; letter-spacing:.02em; vertical-align:1px}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; line-height:1.3}
.chip-good{background:var(--good-bg); color:var(--good-deep)}
.chip-bad{background:var(--bad-bg); color:var(--bad-deep)}
.chip-warn{background:var(--warn-bg); color:var(--warn)}
.chip-neutral{background:var(--neutral-chip); color:var(--text-2)}
.chip-accent{background:var(--indigo-soft); color:var(--indigo-600)}

/* tables */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:600;
  text-align:right; padding:8px 9px; border-bottom:1.5px solid var(--border)}
th.txt,td.txt{text-align:left}
td{padding:8px 9px; border-bottom:1px solid var(--border-soft); text-align:right; color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tr.total td{font-weight:700; border-top:2px solid var(--border); color:var(--ink)}
.muted{color:var(--text-4)}
.table-wrap{overflow-x:auto; border-radius:var(--radius-sm)}

/* ---------- CLIENT LADDER — the showpiece ---------- */
.ladder{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
.ladder th{position:sticky; top:0; background:var(--card); z-index:1; padding:9px 8px; white-space:nowrap}
.ladder td{padding:0 8px; height:46px; border-bottom:1px solid var(--hairline); vertical-align:middle}
.ladder tbody tr{transition:background .12s}
.ladder tbody tr:hover{background:var(--indigo-wash)}
.ladder .cwrap{display:flex; align-items:center; gap:11px}
.avatar{width:30px; height:30px; border-radius:8px; flex-shrink:0; color:#fff; font-size:11px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; letter-spacing:.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 1px 2px rgba(20,24,33,.15)}
.ladder .cname{font-weight:600; color:var(--ink); font-size:13px; line-height:1.2}
.ladder .cstart{font-size:10.5px; color:var(--text-4); font-variant-numeric:tabular-nums}
/* level badge */
.lvl{display:inline-flex; align-items:center; justify-content:center; width:30px; height:24px; border-radius:7px;
  font-weight:700; font-size:11.5px; letter-spacing:.01em; box-shadow:inset 0 0 0 1px rgba(20,24,33,.04)}
.lvl0{background:#F1F3F7; color:#A9B1BF}
.lvl1{background:#EDEBFB; color:#8983D6}
.lvl2{background:#DEDBF9; color:#6C63E0}
.lvl3{background:#C9C5F4; color:#4338CA}
.lvl4{background:#8B83EC; color:#fff}
.lvl5{background:linear-gradient(135deg,#5B52E8,#4338CA); color:#fff; box-shadow:0 2px 6px -1px rgba(79,70,229,.45)}
/* step arrows */
.step{font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums}
.step.none{color:var(--text-4)}
/* uniform spend chip — same size, color = tier; empty months stay blank so the grid reads calm */
.spend-cell{padding:5px 4px !important; text-align:center}
.schip{display:inline-block; min-width:52px; padding:4px 0; border-radius:6px; font-size:11px; font-weight:600;
  font-variant-numeric:tabular-nums; text-align:center; line-height:1.2}
.schip.t1{background:#EEEDFB; color:#7B75D0}
.schip.t2{background:#DFDDF8; color:#5F57DA}
.schip.t3{background:#C7C3F3; color:#4338CA}
.schip.t4{background:#8B83EC; color:#fff}
.schip.t5{background:linear-gradient(135deg,#5B52E8,#4338CA); color:#fff; box-shadow:0 1px 4px -1px rgba(79,70,229,.45)}
/* total spend emphasis */
.ladder .tot{font-weight:700; color:var(--ink)}
.ladder .arpa-big{font-weight:700; color:var(--indigo-600)}

/* status pill with dot */
.st{display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:16px; font-size:11px; font-weight:600; white-space:nowrap}
.st .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0}
.st-active{background:var(--good-bg); color:var(--good-deep)} .st-active .dot{background:var(--good)}
.st-scaling{background:var(--indigo-soft); color:var(--indigo-600)} .st-scaling .dot{background:var(--indigo)}
.st-low{background:var(--warn-bg); color:var(--warn)} .st-low .dot{background:var(--warn)}
.st-watch{background:var(--warn-bg); color:var(--warn)} .st-watch .dot{background:#E0A030}
.st-early{background:var(--neutral-chip); color:var(--text-2)} .st-early .dot{background:var(--text-3)}
.st-risk{background:var(--bad-bg); color:var(--bad-deep)} .st-risk .dot{background:var(--bad)}
.st-inactive{background:#EEF0F4; color:#8A94A6} .st-inactive .dot{background:#B2BAC7}

/* levers */
.lever{margin-bottom:15px}
.lever label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--text)}
.lever .hint{font-size:11px; color:var(--text-3); font-weight:400; margin-left:4px}
.lever input{width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:14px; font-weight:600; font-family:inherit; color:var(--ink); background:#fff; transition:border .15s, box-shadow .15s}
.lever input:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px var(--indigo-soft)}
.locked{background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px;
  font-size:12.5px; color:var(--text-2); display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.locked b{color:var(--ink)}
.live-heading{font-size:15px; font-weight:550; background:linear-gradient(120deg,var(--indigo-wash),var(--indigo-soft));
  border:1px solid var(--indigo-tint); color:var(--indigo-700); border-radius:var(--radius);
  padding:15px 18px; margin-bottom:20px; line-height:1.65}
.live-heading .v{color:var(--indigo-600); font-weight:700}

/* scenarios */
.scen-banner{font-size:14px; font-weight:600; padding:13px 18px; border-radius:var(--radius); margin-bottom:16px}
.scen-banner.ok{background:var(--good-bg); color:var(--good-deep)}
.scen-banner.warn{background:var(--warn-bg); color:var(--warn)}
.scen-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px}
.scen-card{border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; position:relative;
  background:var(--card); box-shadow:none; transition:border-color .15s}
.scen-card:hover{border-color:var(--accent-tint)}
.scen-card.hit{border-color:#A6E0C3; background:linear-gradient(180deg,#F6FCF9,#fff)}
.scen-card h3{font-size:14px; font-weight:700; margin-bottom:8px; color:var(--ink)}
.scen-card .assum{font-size:11.5px; color:var(--text-2); margin:10px 0; line-height:1.55}
.scen-out{font-size:12.5px; display:flex; justify-content:space-between; align-items:center; padding:4px 0}
.scen-out b{font-weight:700; color:var(--ink)}
.apply-btn{margin-top:12px; width:100%; padding:8px; border:1px solid var(--border); background:#fff; border-radius:var(--radius-sm);
  font-family:inherit; font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; transition:all .15s}
.apply-btn:hover{border-color:var(--indigo); color:var(--indigo-600); background:var(--indigo-wash)}

/* misc */
.chart-box{position:relative; width:100%}
.legend-note{font-size:11px; color:var(--text-3); margin-top:10px; line-height:1.5}
.callout{border-left:3px solid var(--indigo); background:var(--indigo-wash); padding:11px 15px; border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12.5px; color:var(--indigo-700); margin:10px 0; line-height:1.55}
.callout.warn{border-left-color:var(--warn); background:var(--warn-bg); color:#7A5310}
.method p{font-size:13.5px; color:var(--text-2); margin-bottom:11px; max-width:76ch; line-height:1.65}
.method h2{margin-top:22px}
.method ul{margin:0 0 12px 20px; font-size:13.5px; color:var(--text-2)}
.method li{margin-bottom:6px; line-height:1.6}
.footer-note{margin-top:28px; font-size:11px; color:var(--text-3)}
.health-tile{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--card)}
.health-tile .h-l{font-size:12.5px; font-weight:600; color:var(--text)}
.health-tile .h-n{font-size:10.5px; color:var(--text-3); margin-top:2px}
.health-tile .h-v{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
</style>
</head>

"use strict";

/* ---------- palette (mirrors CSS custom properties) ---------- */
function cssv(name, fallback){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}
const C = {
  accent: cssv('--accent', '#4F46E5'),
  accentTint: cssv('--accent-tint', '#C2BEF3'),
  accentSoft: cssv('--accent-soft', '#EAE9FC'),
  dark: cssv('--ink', '#141821'),
  good: cssv('--good', '#0E9F6E'),
  bad: cssv('--bad', '#DC2F44'),
  warn: cssv('--warn', '#C77A0F'),
  grey: '#98A2B3',
  grid: cssv('--grid', '#EEF1F6'),
  muted: cssv('--text-3', '#8B94A6')
};

/* ---------- formatters ---------- */
const fmtMoney = v => (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
const fK = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if (a >= 1e3) return s + '$' + Math.round(a/1e3) + 'K';
  return s + '$' + Math.round(a);
};
const fMshort = v => (v<0?'-':'') + '$' + (Math.abs(v)/1e6).toFixed(2) + 'M';
const fPct = (v, dp=0) => (v*100).toFixed(dp) + '%';
const fNum = v => Math.round(v).toLocaleString('en-US');
const f1 = v => v.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1});

/* Sign-aware delta span. goodPos=false flips semantics (e.g. cost overruns). */
function deltaSpan(v, opts){
  const o = Object.assign({goodPos:true, fmt:fNum, prefix:''}, opts||{});
  if (v === 0 || v === null || v === undefined || isNaN(v)) return '<span class="muted num">—</span>';
  const good = o.goodPos ? v > 0 : v < 0;
  const arrow = v > 0 ? '▲' : '▼';
  return '<span class="' + (good?'delta-good':'delta-bad') + ' num" data-v="' + v + '" data-goodpos="' + o.goodPos + '">' +
    arrow + ' ' + o.prefix + o.fmt(Math.abs(v)) + '</span>';
}

/* ============================================================
   ENGINE — replicates the Excel model exactly.
   Levers in, full result out. Every projected number displayed
   anywhere comes from here; actuals come from DATA.
   ============================================================ */
function engine(L){
  const seas = DATA.seasonality, prior = DATA.prior2025, dist = DATA.distribution;
  const li = DATA.meta.latestClosedIdx;               // last closed month (0-based)
  const priorTotal = prior.reduce((a,b)=>a+b,0);

  const seasARPA = seas.map(s => L.arpa * s);          // monthly ARPA at plan seasonality
  const existingPlan = prior.map(p => p * (1 + L.growth));

  // new-client build (plan)
  const signedPlan = dist.map(d => Math.round(d * L.newClients));
  const cumPlan = []; signedPlan.reduce((a,b,i)=> (cumPlan[i]=a+b, cumPlan[i]), 0);
  const newRevOf = (signed, cum) => signed.map((_, m) => {
    const mature = m >= 3 ? cum[m-3] : 0;              // cohorts past their first 3 months
    const ramp = signed[m] + (signed[m-1]||0) + (signed[m-2]||0); // newest 3 cohorts
    return mature * seasARPA[m] + ramp * seasARPA[m] * (1 - L.dropout);
  });
  const newRevPlan = newRevOf(signedPlan, cumPlan);
  const planRev = existingPlan.map((e,m) => e + newRevPlan[m]);

  // blended: actuals for closed months, plan forward
  const rev = planRev.map((p,m) => m <= li ? DATA.actualRevenue[m] : p);

  // "signings stop" baseline: actual signings to date, zero new from next month
  const signedStop = signedPlan.map((s,m) => m <= li ? DATA.actualNewClients[m] : 0);
  const cumStop = []; signedStop.reduce((a,b,i)=> (cumStop[i]=a+b, cumStop[i]), 0);
  const stopRev = existingPlan.map((e,m) => e + newRevOf(signedStop, cumStop)[m]);
  const stopBlend = stopRev.map((p,m) => m <= li ? DATA.actualRevenue[m] : p);

  // ARR: 3-month rolling average of de-seasonalised revenue (window truncated at start)
  const arrOf = series => series.map((_,m) => {
    const w = [];
    for (let k = Math.max(0, m-2); k <= m; k++) w.push(series[k] / seas[k]);
    return w.reduce((a,b)=>a+b,0) / w.length;
  });
  const arr = arrOf(rev);
  const arrStop = arrOf(stopBlend);

  // customer-equivalents
  const custEqTarget = cumPlan.map(c => Math.round(priorTotal / L.arpa + c));
  const custEqActual = DATA.actualRevenue.map((r,m) => Math.round(r / seasARPA[m]));
  const custEqFY = Math.round(L.targetARR / L.arpa);

  // unit economics
  const ltv = L.arpa * (1 - L.dropout) / L.churn;
  const ltvcac = ltv / L.cac;
  const payback = L.cac / (L.arpa * L.gm / 12);
  const nrr = existingPlan.reduce((a,b)=>a+b,0) / priorTotal;

  // shortfall adjustment → additional clients needed (Excel Cockpit!B13)
  const adjSum = DATA.adjustments.reduce((a,b)=>a+b,0);
  const remaining = 12 - (li + 1);
  const addlClients = adjSum < 0 ? Math.ceil(Math.abs(adjSum) / remaining / (L.arpa/12)) : 0;

  // influencer capacity forecast (future months from target cust-eq)
  const influForecast = custEqTarget.map((c,m) => m <= li ? DATA.influActive[m] : Math.round(c * L.influPerClient));
  const adsForecast = influForecast.map((f,m) => m <= li ? DATA.ads[m] : Math.round(f * L.adsPerInflu));

  const ytdActual = DATA.actualRevenue.reduce((a,b)=>a+b,0);
  const ytdPlan = planRev.slice(0, li+1).reduce((a,b)=>a+b,0);
  const cumRev = []; rev.reduce((a,b,i)=> (cumRev[i]=a+b, cumRev[i]), 0);

  return { seasARPA, existingPlan, signedPlan, cumPlan, newRevPlan, planRev, rev, stopBlend,
    arr, arrStop, custEqTarget, custEqActual, custEqFY,
    ltv, ltvcac, payback, nrr, addlClients, adjSum,
    influForecast, adsForecast, ytdActual, ytdPlan, cumRev,
    yeARR: arr[11], latestARR: arr[li], fyPlanRevenue: planRev.reduce((a,b)=>a+b,0) };
}

const state = { levers: Object.assign({ targetARR: DATA.targetARR }, DATA.defaults) };

window.__engine = engine;

const charts = {};
function mkChart(id, cfg){
  const el = document.getElementById(id);
  if (!el) return;
  if (charts[id]) { charts[id].destroy(); }
  charts[id] = new Chart(el.getContext('2d'), cfg);
}
function setChartDefaults(){
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = C.muted;
  // crisp on retina / high-DPI monitors — was the "pixelated" look
  Chart.defaults.devicePixelRatio = Math.max(2, (window.devicePixelRatio || 1));
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  Chart.defaults.plugins.legend.labels.boxHeight = 10;
  Chart.defaults.plugins.legend.labels.padding = 14;
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.legend.labels.font = { size: 11.5, weight: '500' };
  if (Chart.defaults.elements && Chart.defaults.elements.point) Chart.defaults.elements.point.hoverRadius = 5;
  if (Chart.defaults.elements && Chart.defaults.elements.line) Chart.defaults.elements.line.capBezierPoints = true;
}
const darkTooltip = {
  backgroundColor: '#1E2530', titleColor: '#fff', bodyColor: '#D7DCE3',
  padding: 10, cornerRadius: 8, displayColors: true, boxPadding: 4,
  callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y==null ? '—' : fK(ctx.parsed.y)) }
};
const baseScalesMoney = {
  x: { grid: { display:false }, ticks: { color: C.muted } },
  y: { beginAtZero:true, grid: { color: C.grid }, border:{display:false}, ticks: { color: C.muted, callback: v => fK(v) } }
};
function sparkline(id, values, color, fill){
  mkChart(id, { type:'line',
    data:{ labels: values.map((_,i)=>i), datasets:[{ data: values, borderColor: color, borderWidth:1.6,
      pointRadius:0, fill:true, backgroundColor: fill, tension:.35 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{enabled:false}},
      scales:{ x:{display:false}, y:{display:false} }, animation:false } });
}

  /* ---------- COCKPIT ---------- */
  document.getElementById('k-latest-arr').textContent = fMshort(R.latestARR);
  const latestDelta = R.arr[li] - R.arr[li-1];
  document.getElementById('k-latest-note').innerHTML = deltaSpan(latestDelta, {fmt:fK}) + ' vs June';
  document.getElementById('k-ye-arr').textContent = fMshort(R.yeARR);
  const yeGap = R.yeARR - L.targetARR;
  document.getElementById('k-ye-note').innerHTML = (yeGap >= 0
    ? '<span class="chip chip-good">hits target</span>' : '<span class="chip chip-bad">misses target</span>')
    + ' ' + deltaSpan(yeGap, {fmt:fK}) + ' vs ' + fK(L.targetARR);
  document.getElementById('k-ytd').textContent = fK(R.ytdActual);
  document.getElementById('k-ytd-note').innerHTML = deltaSpan(R.ytdActual - R.ytdPlan, {fmt:fK}) + ' vs plan YTD (' + fK(R.ytdPlan) + ')';
  const newcYTD = DATA.actualNewClients.reduce((a,b)=>a+b,0);
  const newcTgt = R.signedPlan.slice(0, li+1).reduce((a,b)=>a+b,0);
  document.getElementById('k-newc').textContent = newcYTD;
  document.getElementById('k-newc-note').innerHTML = deltaSpan(newcYTD - newcTgt) + ' vs plan of ' + newcTgt;

  const sparkFill = (c) => c + '22';
  sparkline('spark-arr', R.arr.slice(0, li+1), latestDelta>=0?C.good:C.bad, sparkFill(latestDelta>=0?C.good:C.bad));
  const yeCol = yeGap>=0?C.good:C.warn;
  sparkline('spark-ye', R.arr.slice(li), yeCol, sparkFill(yeCol));
  const revDelta = DATA.actualRevenue[li] - DATA.actualRevenue[li-1];
  sparkline('spark-rev', DATA.actualRevenue, revDelta>=0?C.good:C.bad, sparkFill(revDelta>=0?C.good:C.bad));
  const ncDelta = DATA.actualNewClients[li] - DATA.actualNewClients[li-1];
  sparkline('spark-newc', DATA.actualNewClients, ncDelta>=0?C.good:C.bad, sparkFill(ncDelta>=0?C.good:C.bad));

  // ARR hero chart
  mkChart('ch-arr', { type:'line', data:{ labels: M, datasets:[
    { label:'Actual ARR', data: R.arr.map((v,m)=> m<=li ? v : null), borderColor:C.dark, backgroundColor:C.dark, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'Projected (levers)', data: R.arr.map((v,m)=> m>=li ? v : null), borderColor:C.accent, backgroundColor:C.accent, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'If signings stop', data: R.arrStop.map((v,m)=> m>=li ? v : null), borderColor:C.grey, borderWidth:1.6, pointRadius:0, borderDash:[5,4], tension:.3 },
    { label:'Target ARR', data: M.map(()=>L.targetARR), borderColor:C.warn, borderWidth:1.2, pointRadius:0, borderDash:[2,3] }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false, mode:'index'},
    plugins:{ tooltip: darkTooltip, legend:{position:'bottom'} }, scales: baseScalesMoney }});

  // monthly revenue chart
  mkChart('ch-rev', { type:'bar', data:{ labels: M, datasets:[
    { label:'Actual', data: DATA.actualRevenue.concat(Array(12-(li+1)).fill(null)), backgroundColor:C.dark, borderRadius:4, barPercentage:.62, order:3 },
    { label:'Projected (levers)', data: R.planRev.map((v,m)=> m>li ? v : null), backgroundColor:C.accentTint, borderRadius:4, barPercentage:.62, order:3 },
    { label:'Full-year plan', data: R.planRev, type:'line', borderColor:C.accent, borderWidth:1.6, pointRadius:0, tension:.3, order:1 },
    { label:'If signings stop', data: R.stopBlend.map((v,m)=> m>=li ? v : null), type:'line', borderColor:C.grey, borderWidth:1.4, borderDash:[5,4], pointRadius:0, tension:.3, order:2 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false, mode:'index'},
    plugins:{ tooltip: darkTooltip, legend:{position:'bottom'} }, scales: baseScalesMoney }});

  // health tiles — color classes strictly follow the pass/fail sign
  const health = [
    { l:'LTV : CAC', v: R.ltvcac.toFixed(1) + 'x', ok: R.ltvcac >= 3, note: 'LTV ' + fK(R.ltv) + ' vs CAC ' + fK(L.cac) },
    { l:'Payback', v: f1(R.payback) + ' mo', ok: R.payback <= 12, note: 'CAC ÷ monthly gross profit per client' },
    { l:'NRR — existing book', v: fPct(R.nrr), ok: R.nrr >= 1, note: 'planned growth of the 2025 base' },
    { l:'ROAS book ARPA today', v: fK(DATA.roasARPA), warn: DATA.roasARPA < L.arpa, note: 'vs ' + fK(L.arpa) + ' assumed for new clients' }
  ];
  document.getElementById('health-tiles').innerHTML = health.map(h => {
    let cls = '', style = '';
    if (h.ok === true) cls = 'delta-good';
    else if (h.ok === false) cls = 'delta-bad';
    else if (h.warn) style = 'style="color:var(--warn)"';
    return '<div class="health-tile"><div><div class="h-l">' + h.l + '</div><div class="h-n">' + h.note + '</div></div>' +
      '<div class="h-v num ' + cls + '" ' + style + ' data-static="1">' + h.v + '</div></div>';
  }).join('');

  // cockpit table
  let ct = '<table><tr><th class="txt">Month</th><th>Actual</th><th>Plan</th><th>Variance</th><th>ARR</th><th>Cumulative revenue</th></tr>';
  for (let m=0; m<12; m++){
    const closed = m <= li;
    ct += '<tr><td class="txt">' + M[m] + (closed?'':' <span class="tag">proj</span>') + '</td>' +

      '<td class="num muted">' + fmtMoney(R.planRev[m]) + '</td>' +

  }
  const ytdVar = R.ytdActual - R.ytdPlan;

  /* ---------- TARGETS ---------- */
  document.getElementById('sub-custeq').textContent =
    'One customer-equivalent = ' + fK(L.arpa) + ' of annual revenue. Full-year target: ' + R.custEqFY + ' equivalents for ' + fK(L.targetARR) + ' ARR.';
  mkChart('ch-custeq', { type:'bar', data:{ labels:M, datasets:[
    { label:'Actual', data: R.custEqActual.concat(Array(12-(li+1)).fill(null)), backgroundColor:C.dark, borderRadius:4, barPercentage:.6 },
    { label:'Target', data: R.custEqTarget, type:'line', borderColor:C.accent, borderWidth:1.8, pointRadius:2, tension:.25 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip:{...darkTooltip, callbacks:{label: c=>' '+c.dataset.label+': '+(c.parsed.y==null?'—':fNum(c.parsed.y))}}, legend:{position:'bottom'} },
    scales:{ x:baseScalesMoney.x, y:{beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fNum(v)}} }}});

  const cumActualSigned = []; DATA.actualNewClients.reduce((a,b,i)=>(cumActualSigned[i]=a+b, cumActualSigned[i]),0);
  mkChart('ch-signed', { type:'line', data:{ labels:M, datasets:[
    { label:'Actual cumulative', data: cumActualSigned.concat(Array(12-(li+1)).fill(null)), borderColor:C.dark, backgroundColor:C.dark, borderWidth:2.4, pointRadius:2.6, pointBackgroundColor:C.dark, spanGaps:false, tension:.15 },
    { label:'Plan cumulative', data: R.cumPlan, borderColor:C.accent, borderWidth:1.8, pointRadius:0, tension:.25 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip:{...darkTooltip, callbacks:{label: c=>' '+c.dataset.label+': '+(c.parsed.y==null?'—':fNum(c.parsed.y))}}, legend:{position:'bottom'} },
    scales:{ x:baseScalesMoney.x, y:{beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fNum(v)}} }}});

  const mixTarget = R.existingPlan.map((e,m)=> e / R.planRev[m]);
  const mixActual = DATA.existingActualRev.map((e,m)=> (e!=null && DATA.actualRevenue[m]) ? e / DATA.actualRevenue[m] : null);
  // existing-share can nudge just above 100% in some months (split computed independently),
  // so lift the ceiling above the real max — otherwise those points clip at the axis and the line looks broken
  const mixMax = Math.max(1.05, ...mixActual.filter(v=>v!=null), ...mixTarget.filter(v=>v!=null)) + 0.03;
  mkChart('ch-mix', { type:'line', data:{ labels:M, datasets:[
    { label:'Existing share — actual', data: mixActual.concat(Array(12-mixActual.length).fill(null)), borderColor:C.dark, borderWidth:2.4, pointRadius:2.6, pointBackgroundColor:C.dark, spanGaps:false, tension:0 },
    { label:'Existing share — plan', data: mixTarget, borderColor:C.accent, borderWidth:1.8, pointRadius:0, tension:.3 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip:{...darkTooltip, callbacks:{label:c=>' '+c.dataset.label+': '+(c.parsed.y==null?'—':fPct(c.parsed.y,1))}}, legend:{position:'bottom'} },
    scales:{ x:baseScalesMoney.x, y:{min:0.3, max:mixMax, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fPct(v)}} }}});

  let tc2 = '<table><tr><th class="txt">Month</th><th>Returning (2025)</th><th>New ROAS (cum.)</th><th>Total active</th><th>Returning %</th></tr>';
  for (let m=0; m<=li; m++){
    const tot = DATA.returningClients[m] + cumActualSigned[m];
    tc2 += '<tr><td class="txt">'+M[m]+'</td><td class="num">'+DATA.returningClients[m]+'</td><td class="num">'+cumActualSigned[m]+'</td>' +
      '<td class="num">'+tot+'</td><td class="num">'+fPct(DATA.returningClients[m]/tot)+'</td></tr>';
  }
  tc2 += '</table>';
  document.getElementById('tbl-counts').innerHTML = tc2;

  const rowT = (label, arr2, fmt, fy) => '<tr><td class="txt">'+label+'</td>' +
    arr2.map(v => '<td class="num">' + (v==null?'<span class="muted">—</span>':fmt(v)) + '</td>').join('') +
    '<td class="num"><b>' + (fy==null?'—':fmt(fy)) + '</b></td></tr>';
  const padA = a => a.concat(Array(12-a.length).fill(null));
  let tt = '<table><tr><th class="txt"></th>' + M.map(m=>'<th>'+m+'</th>').join('') + '<th>FY</th></tr>';
  tt += rowT('Target customer-equivalents', R.custEqTarget, fNum, R.custEqFY);
  tt += rowT('Actual customer-equivalents', padA(R.custEqActual), fNum, null);
  tt += rowT('Target new clients signed', R.signedPlan, fNum, R.signedPlan.reduce((a,b)=>a+b,0));
  tt += rowT('Actual new clients signed', padA(DATA.actualNewClients), fNum, newcYTD);
  tt += rowT('Plan revenue', R.planRev, fK, R.fyPlanRevenue);
  tt += rowT('Actual revenue', padA(DATA.actualRevenue), fK, R.ytdActual);
  tt += '</table>';
  document.getElementById('tbl-targets').innerHTML = tt;

  /* ---------- TOP CLIENTS ---------- */
  const ytdByClient = DATA.topClients.map(c => ({ name:c.name, ytd: c.monthly.reduce((a,b)=>a+(b||0),0), monthly:c.monthly }));
  const top1 = ytdByClient[0];
  const top5ytd = ytdByClient.reduce((a,c)=>a+c.ytd,0);
  document.getElementById('k-top1').textContent = fPct(top1.ytd / R.ytdActual, 1);
  document.getElementById('k-top1-note').textContent = top1.name + ' · ' + fK(top1.ytd) + ' YTD';
  document.getElementById('k-top5').textContent = fPct(top5ytd / R.ytdActual, 1);
  document.getElementById('k-rest').textContent = fPct(1 - top5ytd / R.ytdActual, 1);
  document.getElementById('k-rest-note').textContent = fK(R.ytdActual - top5ytd) + ' across the rest of the book';

  const topColors = [C.accent, '#8B83EC', C.accentTint, '#DEDBF9', '#EEEDFB'];
  mkChart('ch-top', { type:'bar', data:{ labels:M.slice(0,li+1), datasets:
    ytdByClient.map((c,i)=>({ label:c.name, data:c.monthly.map((v,m)=> (v||0)/DATA.actualRevenue[m]), backgroundColor: topColors[i], stack:'s', borderRadius:2, barPercentage:.62 }))
    .concat([{ label:'Rest of book', data: M.slice(0,li+1).map((_,m)=> Math.max(0, 1 - ytdByClient.reduce((a,c)=>a+(c.monthly[m]||0),0)/DATA.actualRevenue[m])), backgroundColor:'#E4E7EC', stack:'s', borderRadius:2, barPercentage:.62 }])
  }, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip:{...darkTooltip, callbacks:{label:c=>' '+c.dataset.label+': '+fPct(c.parsed.y,1)}}, legend:{position:'bottom'} },
    scales:{ x:{...baseScalesMoney.x, stacked:true}, y:{stacked:true, min:0, max:1, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fPct(v)}} }}});

  let tp = '<table><tr><th class="txt">Client</th>' + M.slice(0,li+1).map(m=>'<th>'+m+'</th>').join('') + '<th>YTD</th><th>Share</th></tr>';
  ytdByClient.forEach(c => {
    tp += '<tr><td class="txt">'+c.name+'</td>' + c.monthly.map(v=>'<td class="num">'+(v?fK(v):'<span class="muted">—</span>')+'</td>').join('') +
      '<td class="num"><b>'+fK(c.ytd)+'</b></td><td class="num">'+fPct(c.ytd/R.ytdActual,1)+'</td></tr>';
  });
  tp += '<tr class="total"><td class="txt">Top 5</td>' + M.slice(0,li+1).map((_,m)=>'<td class="num">'+fK(ytdByClient.reduce((a,c)=>a+(c.monthly[m]||0),0))+'</td>').join('') +
    '<td class="num">'+fK(top5ytd)+'</td><td class="num">'+fPct(top5ytd/R.ytdActual,1)+'</td></tr></table>';
  document.getElementById('tbl-top').innerHTML = tp;

  /* ---------- CAC ---------- */
  const mc = DATA.cac.merchant, cc = DATA.cac.creator;
  // a month counts toward blended CAC only if it has both a cost and a non-zero count
  const valid = (src, m) => src.cost[m] != null && src.count[m] != null && src.count[m] > 0;
  const blended = src => {
    let cost = 0, n = 0;
    for (let m = 0; m <= li; m++) if (valid(src, m)) { cost += src.cost[m]; n += src.count[m]; }
    return { cost, n, cac: n ? cost / n : null };
  };
  const mB = blended(mc), cB = blended(cc);
  document.getElementById('k-mcac').textContent = fmtMoney(mB.cac);
  document.getElementById('k-mcac-note').innerHTML = deltaSpan(mc.target - mB.cac, {fmt:fmtMoney, goodPos:true}) + ' vs ' + fmtMoney(mc.target) + ' target';
  document.getElementById('k-mcount').textContent = mB.n;
  document.getElementById('k-mspend').textContent = fmtMoney(mB.cost) + ' acquisition cost';
  document.getElementById('k-ccac').textContent = fmtMoney(cB.cac);
  document.getElementById('k-ccac-note').innerHTML = deltaSpan(cc.target - cB.cac, {fmt:fmtMoney, goodPos:true}) + ' vs ' + fmtMoney(cc.target) + ' target';
  document.getElementById('k-ccount').textContent = cB.n;
  document.getElementById('k-cspend').textContent = fmtMoney(cB.cost) + ' acquisition cost';

  const cacChart = (id, src) => mkChart(id, { type:'bar', data:{ labels:M.slice(0,li+1), datasets:[
    { label:'Actual CAC', data: M.slice(0,li+1).map((_,m)=> valid(src,m) ? src.cost[m]/src.count[m] : null),
      backgroundColor: M.slice(0,li+1).map((_,m)=> valid(src,m) ? (src.cost[m]/src.count[m] <= src.target ? C.dark : '#D08A93') : 'transparent'), borderRadius:4, barPercentage:.62 },
    { label:'Target', data: M.slice(0,li+1).map(()=>src.target), type:'line', borderColor:C.warn, borderWidth:1.5, borderDash:[4,3], pointRadius:0 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip:{...darkTooltip, callbacks:{label:c=>' '+c.dataset.label+': '+(c.parsed.y==null?'—':fmtMoney(c.parsed.y))}}, legend:{position:'bottom'} }, scales: baseScalesMoney }});
  cacChart('ch-mcac', mc); cacChart('ch-ccac', cc);

  const cacTable = (src, unit, B) => {
    let t = '<table><tr><th class="txt">Month</th><th>Acq. cost</th><th>'+unit+'</th><th>CAC</th><th>vs target</th></tr>';
    for (let m=0; m<=li; m++){
      const has = src.cost[m] != null;
      const canCac = valid(src, m);
      const cacV = canCac ? src.cost[m]/src.count[m] : null;
      t += '<tr><td class="txt">'+M[m]+'</td>' +
        '<td class="num">'+(has?fmtMoney(src.cost[m]):'<span class="muted">—</span>')+'</td>' +
        '<td class="num">'+(src.count[m]!=null?src.count[m]:'<span class="muted">—</span>')+'</td>' +
        '<td class="num">'+(cacV!=null?fmtMoney(cacV):'<span class="muted">n/a</span>')+'</td>' +
        '<td class="num">'+(cacV!=null?deltaSpan(src.target-cacV,{fmt:fmtMoney}):'<span class="muted">—</span>')+'</td></tr>';
    }
    t += '<tr class="total"><td class="txt">Blended YTD</td><td class="num">'+fmtMoney(B.cost)+'</td><td class="num">'+B.n+'</td>' +
      '<td class="num">'+(B.cac!=null?fmtMoney(B.cac):'—')+'</td><td class="num">'+(B.cac!=null?deltaSpan(src.target-B.cac,{fmt:fmtMoney}):'—')+'</td></tr></table>';
    return t;
  };
  document.getElementById('tbl-mcac').innerHTML = cacTable(mc, 'Merchants', mB);
  document.getElementById('tbl-ccac').innerHTML = cacTable(cc, 'Creators', cB);

  // combined acquisition-cost breakdown (both sides, per month) — replaces the old placeholder
  const bothMonths = [];
  for (let m=0; m<=li; m++){
    const mCacV = valid(mc,m) ? mc.cost[m]/mc.count[m] : null;
    const cCacV = valid(cc,m) ? cc.cost[m]/cc.count[m] : null;
    bothMonths.push({ m, mCost:mc.cost[m], mN:mc.count[m], mCac:mCacV, cCost:cc.cost[m], cN:cc.count[m], cCac:cCacV });
  }
  let bt = '<table><tr><th class="txt">Month</th>' +
    '<th>Merchant cost</th><th>Merchants</th><th>Merchant CAC</th>' +
    '<th>Creator cost</th><th>Creators</th><th>Creator CAC</th><th>Total spend</th></tr>';
  let tMcost=0, tCcost=0;
  bothMonths.forEach(b => {
    const tot = (b.mCost||0) + (b.cCost||0); tMcost += b.mCost||0; tCcost += b.cCost||0;
    bt += '<tr><td class="txt">'+M[b.m]+'</td>' +
      '<td class="num">'+(b.mCost!=null?fmtMoney(b.mCost):'—')+'</td><td class="num">'+(b.mN!=null?b.mN:'—')+'</td>' +
      '<td class="num">'+(b.mCac!=null?fmtMoney(b.mCac):'<span class="muted">n/a</span>')+'</td>' +
      '<td class="num">'+(b.cCost!=null?fmtMoney(b.cCost):'—')+'</td><td class="num">'+(b.cN!=null?b.cN:'<span class="muted">—</span>')+'</td>' +
      '<td class="num">'+(b.cCac!=null?fmtMoney(b.cCac):'<span class="muted">n/a</span>')+'</td>' +
      '<td class="num tot">'+fmtMoney(tot)+'</td></tr>';
  });
  bt += '<tr class="total"><td class="txt">YTD total</td>' +
    '<td class="num">'+fmtMoney(tMcost)+'</td><td class="num">'+mB.n+'</td><td class="num">'+(mB.cac!=null?fmtMoney(mB.cac):'—')+'</td>' +
    '<td class="num">'+fmtMoney(tCcost)+'</td><td class="num">'+cB.n+'</td><td class="num">'+(cB.cac!=null?fmtMoney(cB.cac):'—')+'</td>' +
    '<td class="num tot">'+fmtMoney(tMcost+tCcost)+'</td></tr></table>';
  document.getElementById('tbl-cac-breakdown').innerHTML = bt;
  // note any month excluded for a missing count
  const missing = [];
  for (let m=0; m<=li; m++){ if (cc.cost[m]!=null && (cc.count[m]==null||cc.count[m]===0)) missing.push(M[m]+' (creator count)'); if (mc.cost[m]!=null && (mc.count[m]==null||mc.count[m]===0)) missing.push(M[m]+' (merchant count)'); }
  document.getElementById('cac-note').innerHTML = missing.length
    ? '<b>Note:</b> ' + missing.join(', ') + ' had acquisition spend recorded but no acquisition count in the workbook, so that month is included in total spend but excluded from the blended CAC (dividing by zero). Blended CAC uses only months with both figures.'
    : 'Blended CAC = total acquisition cost ÷ total acquisitions across all months shown.';

  /* ---------- LEVERS ---------- */
  document.getElementById('live-heading').innerHTML =
    'At <span class="v">' + fPct(L.growth) + '</span> existing-book growth, <span class="v">' + L.newClients +
    '</span> new clients at <span class="v">' + fK(L.arpa) + '</span> ARPA with <span class="v">' + fPct(L.dropout) +
    '</span> early dropout → year-end ARR <span class="v num">' + fMshort(R.yeARR) + '</span> against a <span class="v num">' +
    fK(L.targetARR) + '</span> target — ' + (yeGap>=0
      ? '<span class="delta-good" data-v="'+yeGap+'" data-goodpos="true">on target, ▲ ' + fK(yeGap) + ' of headroom</span>'
      : '<span class="delta-bad" data-v="'+yeGap+'" data-goodpos="true">▼ short by ' + fK(Math.abs(yeGap)) + '</span>') + '.';

  document.getElementById('lk-2025').textContent = fmtMoney(DATA.prior2025.reduce((a,b)=>a+b,0));
  document.getElementById('lk-influ').textContent = L.influPerClient;
  document.getElementById('lk-ads').textContent = L.adsPerInflu;
  document.getElementById('adj-callout').innerHTML = '<b>Shortfall check:</b> the workbook models ' + fK(Math.abs(R.adjSum)) +
    ' of revenue at risk over Aug–Dec; covering it at ' + fK(L.arpa) + ' ARPA would take <b>' + R.addlClients +
    ' additional clients</b> on top of the plan.';

  const outs = [
    { l:'Year-end ARR', v:fMshort(R.yeARR), n:(yeGap>=0?'▲ ':'▼ ') + fK(Math.abs(yeGap)) + ' vs target', ok: yeGap>=0 },
    { l:'FY plan revenue', v:fK(R.fyPlanRevenue), n:'existing ' + fK(R.existingPlan.reduce((a,b)=>a+b,0)) + ' + new ' + fK(R.newRevPlan.reduce((a,b)=>a+b,0)) },
    { l:'LTV (new clients)', v:fK(R.ltv), n:'ARPA × (1−dropout) ÷ churn' },
    { l:'LTV : CAC', v:R.ltvcac.toFixed(1)+'x', n: R.ltvcac>=3 ? 'above the 3x rule of thumb' : 'below the 3x rule of thumb', ok:R.ltvcac>=3 },
    { l:'Payback', v:f1(R.payback)+' mo', n:'months of gross profit to repay CAC', ok:R.payback<=12 },
    { l:'NRR (existing)', v:fPct(R.nrr), n:'net revenue retention of 2025 base', ok:R.nrr>=1 }
  ];
  document.getElementById('lever-outputs').innerHTML = outs.map(o =>
    '<div><div class="kpi-label">'+o.l+'</div><div class="kpi-value num" style="font-size:19px">'+o.v+'</div>' +
    '<div class="kpi-note' + (o.ok===true?' delta-good':(o.ok===false?' delta-bad':'')) + '" data-static="1">'+o.n+'</div></div>').join('');

  // revenue build stacked chart
  const rampRev = R.signedPlan.map((_,m)=>{
    const ramp = R.signedPlan[m] + (R.signedPlan[m-1]||0) + (R.signedPlan[m-2]||0);
    return ramp * R.seasARPA[m] * (1 - L.dropout);
  });
  const matureRev = R.newRevPlan.map((v,m)=> v - rampRev[m]);
  mkChart('ch-build', { type:'bar', data:{ labels:M, datasets:[
    { label:'Existing book', data:R.existingPlan, backgroundColor:'#2A2740', stack:'b', borderRadius:2, barPercentage:.62 },
    { label:'New — first 3 months (ramping)', data:rampRev, backgroundColor:C.accentTint, stack:'b', borderRadius:2, barPercentage:.62 },
    { label:'New — matured (month 4+)', data:matureRev, backgroundColor:C.accent, stack:'b', borderRadius:2, barPercentage:.62 },
    { label:'Actual revenue', data: DATA.actualRevenue.concat(Array(12-(li+1)).fill(null)), type:'line', borderColor:C.dark, borderWidth:2.4, pointRadius:2.6, pointBackgroundColor:C.dark, spanGaps:false, tension:0, order:0 }
  ]}, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip: darkTooltip, legend:{position:'bottom'} },
    scales:{ x:{...baseScalesMoney.x, stacked:true}, y:{...baseScalesMoney.y, stacked:true} }}});

  let tb = '<table><tr><th class="txt"></th>' + M.map(m=>'<th>'+m+'</th>').join('') + '<th>FY</th></tr>';

  tb += rowT('Cumulative signed', R.cumPlan, fNum, R.cumPlan[11]);
  tb += rowT('Existing revenue', R.existingPlan, fK, R.existingPlan.reduce((a,b)=>a+b,0));
  tb += rowT('New-client revenue', R.newRevPlan, fK, R.newRevPlan.reduce((a,b)=>a+b,0));
  tb += rowT('Total plan', R.planRev, fK, R.fyPlanRevenue);
  tb += '</table>';
  document.getElementById('tbl-build').innerHTML = tb;

  /* ---------- SCENARIOS ---------- */
  const scenResults = SCENARIOS.map(s => {
    const lv = Object.assign({}, state.levers, s.set);
    return { s, lv, r: engine(lv) };
  });
  const hits = scenResults.filter(x => x.r.yeARR >= L.targetARR).length;
  const banner = document.getElementById('scen-banner');
  banner.className = 'scen-banner ' + (hits >= 1 ? 'ok' : 'warn');
  banner.textContent = hits + ' of ' + SCENARIOS.length + ' scenarios reach the ' + fK(L.targetARR) + ' year-end ARR target.';
  document.getElementById('scen-cards').innerHTML = scenResults.map((x,i) => {
    const hit = x.r.yeARR >= L.targetARR;
    return '<div class="scen-card' + (hit?' hit':'') + '"><h3>' + x.s.name + '</h3>' +
      '<span class="chip ' + (hit?'chip-good':'chip-bad') + '">' + (hit ? 'hits ' : 'misses ') + fK(L.targetARR) + '</span>' +
      '<div class="assum">' + x.s.desc + '</div>' +
      '<div class="scen-out"><span>Year-end ARR</span><b class="num">' + fMshort(x.r.yeARR) + '</b></div>' +
      '<div class="scen-out"><span>Gap to target</span>' + deltaSpan(x.r.yeARR - L.targetARR, {fmt:fK}) + '</div>' +
      '<div class="scen-out"><span>FY plan revenue</span><b class="num">' + fK(x.r.fyPlanRevenue) + '</b></div>' +
      '<div class="scen-out"><span>LTV : CAC</span><b class="num">' + x.r.ltvcac.toFixed(1) + 'x</b></div>' +
      '<button class="apply-btn" data-scen="' + i + '">Apply to levers</button></div>';
  }).join('');
  document.querySelectorAll('#scen-cards .apply-btn').forEach(btn => btn.addEventListener('click', () => {
    const s = SCENARIOS[+btn.dataset.scen];
    state.levers = Object.assign({}, state.levers, s.set);
    syncInputs(); render(); showPage('levers');
  }));

  const scenColors = [C.accent, '#D08770', '#B48EAD', '#8FA1B3', C.good];
  mkChart('ch-scen', { type:'line', data:{ labels:M, datasets:
    [{ label:'Actual', data: (function(){ const base = engine(state.levers); return base.arr.map((v,m)=> m<=li ? v : null); })(), borderColor:C.dark, borderWidth:2.6, pointRadius:2.5, tension:.3 }]
    .concat(scenResults.map((x,i)=>({ label:x.s.name, data: x.r.arr.map((v,m)=> m>=li ? v : null),
      borderColor: scenColors[i], borderWidth:1.8, pointRadius:0, tension:.3, borderDash: x.r.yeARR>=L.targetARR?[0]:[6,4] })))
    .concat([{ label:'Target', data:M.map(()=>L.targetARR), borderColor:C.warn, borderWidth:1.2, borderDash:[2,3], pointRadius:0 }])
  }, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'},
    plugins:{ tooltip: darkTooltip, legend:{position:'bottom'} }, scales: baseScalesMoney }});

  /* ---------- ROAS ---------- */
  const statusMap = {
    '✓ Active': 'chip-good', '↑ Scaling': 'chip-accent', '~ Low spend': 'chip-warn',
    '→ Watch': 'chip-warn', '— Too early': 'chip-neutral', '✗ At risk': 'chip-bad', '⬛ Inactive': 'chip-neutral'
  };
  const norm = s => s === 'Inactive' ? '⬛ Inactive' : s;
  const counts = {};
  DATA.roasClients.forEach(c => { const k = norm(c.status); counts[k] = (counts[k]||0)+1; });
  const order = ['✓ Active','↑ Scaling','~ Low spend','→ Watch','— Too early','✗ At risk','⬛ Inactive'];
  const stClass2 = {
    '✓ Active':'st-active', '↑ Scaling':'st-scaling', '~ Low spend':'st-low', '→ Watch':'st-watch',
    '— Too early':'st-early', '✗ At risk':'st-risk', '⬛ Inactive':'st-inactive'
  };
  const stLbl2 = { '✓ Active':'Active', '↑ Scaling':'Scaling', '~ Low spend':'Low spend', '→ Watch':'Watch',
    '— Too early':'Too early', '✗ At risk':'At risk', '⬛ Inactive':'Inactive' };
  document.getElementById('roas-chips').innerHTML = order.filter(k=>counts[k]).map(k =>
    '<span class="st ' + stClass2[k] + '" style="font-size:12px; padding:5px 12px 5px 10px"><span class="dot"></span>' + stLbl2[k] + ' · ' + counts[k] + '</span>').join('') +
    '<span class="st st-inactive" style="font-size:12px; padding:5px 12px 5px 10px; background:var(--neutral-chip); color:var(--text-2)"><span class="dot" style="background:var(--text-3)"></span>Total · ' + DATA.roasClients.length + '</span>';
  document.getElementById('k-roas-arpa').textContent = fK(DATA.roasARPA);
  document.getElementById('roas-arpa-callout').innerHTML =
    '<b>Watch this gap:</b> the growth plan assumes new clients are worth <b>' + fK(L.arpa) + '</b> a year, but the current ROAS book averages <b>' +
    fK(DATA.roasARPA) + '</b> — most clients are still sitting at the $1K test level. The plan only works if clients climb the ladder the way Right Bite and Golden Scent did.';

  const stClass = {
    '✓ Active':'st-active', '↑ Scaling':'st-scaling', '~ Low spend':'st-low', '→ Watch':'st-watch',
    '— Too early':'st-early', '✗ At risk':'st-risk', '⬛ Inactive':'st-inactive'
  };
  const stLabel = { '✓ Active':'Active', '↑ Scaling':'Scaling', '~ Low spend':'Low spend', '→ Watch':'Watch',
    '— Too early':'Too early', '✗ At risk':'At risk', '⬛ Inactive':'Inactive' };
  // deterministic monogram color from the client name (self-contained, no external logos)
  const AV_COLORS = ['#4F46E5','#1B9E4B','#C77A0F','#2563EB','#DB2777','#0E7490','#0891B2','#CA8A04','#DC2626','#059669','#4F7CAC','#B45309'];
  const avatar = name => {
    let h = 0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    const col = AV_COLORS[h % AV_COLORS.length];
    const initials = name.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
    return '<span class="avatar" style="background:'+col+'">'+initials+'</span>';
  };
  // spend tier → chip class (uniform size, color carries magnitude; aligned to the L1–L5 ladder)
  const tierOf = v => v>=4500?5 : v>=3600?4 : v>=2700?3 : v>=1800?2 : 1;
  const sorted = DATA.roasClients.map((c,i)=>({c,i}))
    .sort((a,b)=> (b.c.level - a.c.level) || (b.c.totalSpend - a.c.totalSpend));
  let tr2 = '<table class="ladder"><thead><tr><th class="txt">Client</th><th>Mo.</th><th>Level</th>' +
    '<th>1→2</th><th>2→3</th><th>3→4</th>' +
    DATA.roasMonths.map(m=>'<th>'+m+'</th>').join('') + '<th>Total</th><th>ARPA</th><th class="txt">Status</th></tr></thead><tbody>';
  sorted.forEach(({c}) => {
    const lvl = Math.round(c.level);
    const step = v => (v==='-'||v==null) ? '<span class="step none">–</span>' : '<span class="step">'+v+'mo</span>';
    tr2 += '<tr>' +
      '<td class="txt"><div class="cwrap">'+avatar(c.name)+'<div><div class="cname">'+c.name+'</div><div class="cstart">since '+c.start+'</div></div></div></td>' +
      '<td class="num">'+c.moActive+'</td>' +
      '<td><span class="lvl lvl'+lvl+'">L'+lvl+'</span></td>' +
      '<td>'+step(c.l12)+'</td><td>'+step(c.l23)+'</td><td>'+step(c.l34)+'</td>' +
      c.spend.map(v => {
        if (v == null) return '<td class="spend-cell"></td>';
        return '<td class="spend-cell"><span class="schip t'+tierOf(v)+'">'+fNum(v)+'</span></td>';
      }).join('') +
      '<td class="num tot">'+fmtMoney(c.totalSpend)+'</td>' +
      '<td class="num arpa-big">'+fmtMoney(c.arpa)+'</td>' +
      '<td class="txt"><span class="st '+(stClass[norm(c.status)]||'st-inactive')+'"><span class="dot"></span>'+(stLabel[norm(c.status)]||norm(c.status))+'</span></td>' +
      '</tr>';
  });
  tr2 += '</tbody></table>';
  document.getElementById('tbl-roas').innerHTML = tr2;

  /* ---------- METHOD ---------- */
  document.getElementById('method-body').innerHTML = `
    <h2>What this dashboard is</h2>
    <p>A live version of the Moontech 2026 unit-economics model. Actuals are closed through <b>August 2026</b>; everything after that is computed by one engine from the levers on the Levers page. When a lever changes, every projected number on every page changes with it — there are no separately typed targets.</p>
    <h2>How revenue is built</h2>
    <ul>
      <li><b>Existing book:</b> each month of 2025 actual revenue, grown by the existing-client growth lever (currently ${fPct(L.growth)}). Full-year 2025 was ${fmtMoney(DATA.prior2025.reduce((a,b)=>a+b,0))}.</li>
      <li><b>New clients:</b> the full-year signing count (currently ${L.newClients}) is spread across the year on a fixed ramp — 1% of signings in January rising to 14% in November and December. A client's revenue in any month is the plan ARPA shaped by that month's seasonality weight.</li>
      <li><b>Early dropout:</b> clients in their first three months are discounted by the dropout lever (currently ${fPct(L.dropout)}), reflecting ROAS clients that quit after the test phase. From month four a cohort pays full seasonal ARPA.</li>
      <li><b>Seasonality:</b> the 2025 monthly revenue shape (November peaks at ~16% of the year). Seasonality is treated as a fact, not a lever.</li>
    </ul>
    <h2>How ARR is measured</h2>
    <p>Monthly revenue is de-seasonalised (divided by that month's seasonality weight) and averaged over a rolling three months, giving an annualised run-rate that isn't distorted by strong or weak seasonal months. July's ARR of ${fMshort(R.latestARR)} is the May–July average run-rate. Moving forward, actuals roll out of the window as projections enter it.</p>
    <h2>Unit economics</h2>
    <ul>
      <li><b>LTV</b> = ARPA × (1 − 3-month dropout) ÷ annual churn.</li>
      <li><b>Payback</b> = CAC ÷ (ARPA × gross margin ÷ 12) — months of gross profit to recover acquisition cost.</li>
      <li><b>Customer-equivalent</b> = ${fK(L.arpa)} of annual revenue, so one large client can count as several equivalents.</li>
    </ul>
    <h2>Basis and scope of the numbers</h2>
    <ul>
      <li>Revenue is Moontech platform revenue on an operational basis, in USD, as recorded in the model workbook.</li>
      <li><b>Merchant CAC</b> and <b>Creator CAC</b> are total acquisition cost ÷ acquisitions, blended across every closed month that has both a cost and a count. Where the workbook records spend for a month but no acquisition count (e.g. August creator count), that month is kept in total spend but left out of the blended CAC so the average is not divided by zero.</li>
      <li>The <b>“if signings stop”</b> line keeps the existing book growing at the growth lever and lets already-signed clients play out, but adds zero new signings from August.</li>
      <li>July's existing-vs-new revenue split isn't in the source workbook yet, so the revenue-mix chart shows actuals through June only.</li>
    </ul>
    <h2>Known data notes</h2>
    <ul>
      <li>Izil shows $8,169 spend in May but is recorded at Level 1 in the workbook — worth confirming at source.</li>
      <li>August creator acquisitions have a cost recorded but no count yet, so August is excluded from blended creator CAC (see the CAC page note).</li>
      <li>The 30 ROAS clients here reconcile 1:1 with the workbook's client list.</li>
    </ul>
    <div class="footer-note">Built from Unit_Economics_Model (1).xlsx · actuals through July 2026 · monthly update = replace the DATA block at the top of this file and commit.</div>`;
}

/* ---------- lever inputs ---------- */
const PCT_LEVERS = ['growth','dropout','churn','gm'];
function syncInputs(){
  Object.keys(state.levers).forEach(k => {
    const el = document.getElementById('lv-' + k);
    if (!el) return;
    el.value = PCT_LEVERS.includes(k) ? Math.round(state.levers[k]*1000)/10 : state.levers[k];
  });
}
function bindInputs(){
  ['growth','newClients','arpa','dropout','churn','cac','gm','targetARR'].forEach(k => {
    const el = document.getElementById('lv-' + k);
    if (!el) return;
    el.addEventListener('input', () => {
      const raw = parseFloat(el.value);
      if (isNaN(raw)) return;
      state.levers[k] = PCT_LEVERS.includes(k) ? raw/100 : raw;
      render();
    });
  });
}

/* ---------- navigation ---------- */
function showPage(name){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === name));
}
function bindNav(){
  document.querySelectorAll('#nav a').forEach(a => a.addEventListener('click', () => showPage(a.dataset.page)));
}

/* ---------- boot ---------- */
function boot(){
  setChartDefaults();
  buildPages();
  bindNav();
  syncInputs();
  bindInputs();
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
